[project]
name = "prove2me-cli"
version = "0.1.0"
description = "Command-line client for Prove2Me that keeps the API key out of agents' hands"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    # httpx verifies TLS with certifi's bundle, which works on Pythons whose
    # system store is missing.
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
prove2me = "prove2me_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prove2me_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
